name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  qt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Qt, CMake, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build qt6-base-dev qt6-qpa-plugins qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qttest
          echo /usr/lib/qt6/bin >> "$GITHUB_PATH"
      - run: npm run integration:qt
      - name: Upload Qt quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-integration-evidence
          path: test/fixtures/integration/qtquick/target/qmlqualitylens

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run

  oracle-qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install optional Qt/qmllint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-layouts || true
          echo /usr/lib/qt6/bin >> "$GITHUB_PATH"
      - run: npm run oracle:qmllint
